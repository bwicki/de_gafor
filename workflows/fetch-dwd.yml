name: DWD-Berichte holen

# dwd.de erlaubt keine Cross-Origin-Zugriffe, deshalb holt dieser Workflow die
# frei zugänglichen Luftsportberichte und legt sie als JSON im Repo ab. Die App
# liest die Datei dann von der eigenen Origin.

on:
  schedule:
    - cron: '7,27,47 * * * *'      # dreimal pro Stunde
  workflow_dispatch:               # Handstart über den Actions-Tab
  push:
    paths:
      - 'scripts/fetch-dwd.mjs'
      - '.github/workflows/fetch-dwd.yml'

permissions:
  contents: write

concurrency:
  group: fetch-dwd
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Berichte abrufen und parsen
        run: node scripts/fetch-dwd.mjs

      - name: Änderungen committen
        run: |
          git config user.name  "gaforcast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dwd
          if git diff --cached --quiet; then
            echo "keine Änderung"
            exit 0
          fi
          git commit -m "DWD-Berichte $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
